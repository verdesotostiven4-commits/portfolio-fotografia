<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Portafolio profesional byStiven: fotografía de eventos, quinceaños, decoración, naturaleza y galerías privadas." />
    <title>byStiven · Portfolio Fotografía</title>
    <script>
      (function () {
        var path = decodeURIComponent(window.location.pathname).toLowerCase().replace(/\/+$/, "");
        var isClientGallery = path === "/galerias/maternidad-playa" || path === "/maternidad-playa";
        if (isClientGallery) return;
        ["/edge.css", "/carousel.css", "/section-blend.css", "/mobile-polish.css"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/maternidad-playa.js"></script>
    <script>
      (function () {
        var path = decodeURIComponent(window.location.pathname).toLowerCase().replace(/\/+$/, "");
        var isClientGallery = path === "/galerias/maternidad-playa" || path === "/maternidad-playa";
        if (isClientGallery) return;

        var module = document.createElement("script");
        module.type = "module";
        module.src = "/src/main.tsx";
        document.body.appendChild(module);

        ["/carousel.js", "/portfolio-polish.js", "/smooth-reveal.js", "/mobile-native.js"].forEach(function (src) {
          var script = document.createElement("script");
          script.src = src;
          script.defer = true;
          document.body.appendChild(script);
        });
      })();
    </script>
  </body>
</html>
