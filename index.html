<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Portafolio profesional byStiven: fotografía de eventos, quinceaños, decoración, naturaleza y galerías privadas." />
    <title>byStiven · Portfolio Fotografía</title>
    <script>
      (function () {
        var path = decodeURIComponent(window.location.pathname).toLowerCase().replace(/\/+$/, "");
        var isMaternityGallery = path === "/galerias/maternidad-playa" || path === "/maternidad-playa";
        var isMaternityAdmin = path === "/admin/maternidad" || path === "/admin/maternidad-playa";
        window.__BYSTIVEN_CLIENT_GALLERY__ = isMaternityGallery;
        window.__BYSTIVEN_MATERNITY_ADMIN__ = isMaternityAdmin;
        if (isMaternityGallery || isMaternityAdmin) return;

        ["/edge.css", "/carousel.css", "/section-blend.css", "/mobile-polish.css"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/router.ts"></script>
  </body>
</html>
