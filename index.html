<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#090909" />
    <meta name="description" content="Portafolio profesional byStiven: fotografía de eventos, quinceaños, decoración, naturaleza y galerías privadas." />
    <title>byStiven · Portfolio Fotografía</title>
    <script>
      (function () {
        var path = decodeURIComponent(window.location.pathname).toLowerCase().replace(/\/+$/, "");
        var isClientGallery = path === "/galerias/maternidad-playa" || path === "/maternidad-playa";
        window.__BYSTIVEN_CLIENT_GALLERY__ = isClientGallery;
        if (isClientGallery) return;

        ["/edge.css", "/carousel.css", "/section-blend.css", "/mobile-polish.css"].forEach(function (href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        function loadScript(src, options) {
          var script = document.createElement("script");
          script.src = src;
          if (options && options.type) script.type = options.type;
          if (options && options.defer) script.defer = true;
          if (options && options.onload) script.onload = options.onload;
          document.body.appendChild(script);
        }

        if (window.__BYSTIVEN_CLIENT_GALLERY__) {
          loadScript("/maternidad-playa-config.js", {
            onload: function () { loadScript("/maternidad-playa.js"); }
          });
          return;
        }

        loadScript("/src/main.tsx", { type: "module" });
        ["/carousel.js", "/portfolio-polish.js", "/smooth-reveal.js", "/mobile-native.js"].forEach(function (src) {
          loadScript(src, { defer: true });
        });
      })();
    </script>
  </body>
</html>
